[package]
name = "gsb-core"
version = "0.2.0"
edition = "2021"
description = "GSB Gateway data plane: Wintun virtual adapter that sends all system TCP/DNS (and UDP via udpgw) through the GSB Gateway bridge"

[[bin]]
name = "gsb-core"
path = "src/main.rs"

[dependencies]
tun2proxy = { version = "=0.8.5", default-features = false, features = ["udpgw"] }
tun = { version = "=0.8.14", features = ["async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "time", "sync"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
